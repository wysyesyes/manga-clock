<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漫畫圖上豎排時鐘</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    background:#000;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}
/* 漫畫容器：定位基準 */
.manga-wrap{
    position:relative;
    max-width:90vmin; /* 正方形最大邊長，vmin會自適應手機/電腦 */
}
/* 漫畫背景圖 */
.manga-img{
    width:100%;
    display:block;
}
/* 漫畫白色對話框，相對於漫畫圖定位，尺寸使用vmin跟圖一起縮放 */
.bubble{
    position:absolute;
    top:61.5%;
    left:41.4%;
    width:12vmin;
    height:40vmin;
    background:#transparent;
    /*border:2px solid #000;*/
    display:flex;
    flex-direction:row-reverse;
    justify-content:center;
    gap:-0.2vmin;
    padding:2vmin 1.2vmin;
}
.vertical-text{
    writing-mode: vertical-rl;
    text-orientation:mixed;
    font-family:"Noto Serif TC", serif, sans-serif;
    color:#000;
}
/* 只有漢字「現在時間：」加粗 */
.label{
    font-size:3.8vmin;
    letter-spacing:0.6vmin;
    font-weight:bold;
}
/* 時間數字保持細體 */
#timeText{
    font-size:5.2vmin;
    letter-spacing:0.3vmin;
    font-weight:normal;
}
</style>
</head>
<body>
    <div class="manga-wrap">
        <img class="manga-img" src="manga.jpg" alt="漫畫">
        <div class="bubble">
            <div class="vertical-text label">現在時間：</div>
            <div id="timeText" class="vertical-text">00:00:00</div>
        </div>
    </div>
<script>
function updateTime(){
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('timeText').innerText = `${h}:${m}:${s}`;
}
updateTime();
setInterval(updateTime,1000);
</script>
</body>
</html>
